services:
  # --- Agent framework store (LangGraph checkpoints + mem0 vectors + auth tables) ---
  # Business data (jobs/favorites/reports) stays in SQLite; this database only
  # backs the agent framework ported from the fastapi-langgraph-agent template.
  agent-db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-job_matcher_agent}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      # Host port is configurable — 5432 is often already taken by a local
      # Postgres. The backend container always reaches it on 5432 internally.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agent-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-job_matcher_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Backend API ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist database and uploads across restarts
      - backend-data:/app/data
      # Mount Docker socket so backend can create sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-crawler-sandbox}
      # Agent framework
      - APP_ENV=${APP_ENV:-development}
      - POSTGRES_HOST=agent-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-job_matcher_agent}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme-in-production}
      - LANGFUSE_TRACING_ENABLED=${LANGFUSE_TRACING_ENABLED:-false}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      agent-db:
        condition: service_healthy
    restart: unless-stopped

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # At build time, tell Next.js where the API is.
        # In browser, requests go to the host-exposed backend port.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # --- Crawler Sandbox (pre-built image, not a running service) ---
  # This service only builds the sandbox image.
  # The backend creates/destroys sandbox containers on-demand via Docker socket.
  sandbox:
    build:
      context: ./backend
      dockerfile: Dockerfile.sandbox
    image: crawler-sandbox
    # This service should not run persistently
    profiles:
      - build-only

volumes:
  backend-data:
  agent-db-data:
