[project]
name = "job-matcher-backend"
version = "0.1.0"
description = "智能岗位聚合与匹配平台 - 后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.20.0",
    "openai>=1.0.0",
    "tiktoken>=0.7.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "httpx[socks]>=0.28.1",
    "python-dotenv>=1.2.2",
    "docker>=7.0.0",
    "playwright>=1.49.0",
    # ── Agent framework (ported from fastapi-langgraph-agent template) ──
    "langchain>=1.0.5",
    "langchain-core>=1.0.4",
    "langchain-openai>=1.0.2",
    "langgraph>=1.0.2",
    "langgraph-checkpoint-postgres>=3.0.1",
    "psycopg[binary,pool]>=3.2.0",
    "langfuse>=3.9.1",
    "mem0ai>=1.0.0",
    "sqlmodel>=0.0.25",
    "bcrypt>=4.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.4.0",
    "email-validator>=2.2.0",
    "structlog>=25.2.0",
    "asgi-correlation-id>=4.3.4",
    "slowapi>=0.1.9",
    "prometheus-client>=0.19.0",
    "starlette-prometheus>=0.7.0",
    "tenacity>=9.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
